apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-googlemusic
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hemanthg-git/Kubernetes-ecommerce-microservices.git
    path: frontend/googlemusic
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: microservices
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
